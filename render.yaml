services:
  - type: web
    # O nome vira o subdomínio .onrender.com no momento em que o serviço é
    # criado, e renomear depois não muda o link.
    name: rpcultural
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: REFRESH_SECONDS
        value: "300"
      # sync: false faz o Render pedir o valor no painel em vez de guardar aqui.
      # Chave privada não pode ir para o repositório: quem a tiver consegue
      # mandar notificação em nome do app. Gerar com: python server/push.py
      - key: VAPID_PUBLIC
        sync: false
      - key: VAPID_PRIVATE
        sync: false
      - key: VAPID_SUB
        sync: false
      # senha do painel /admin.html. Sem ela o envio em massa fica bloqueado.
      - key: ADMIN_TOKEN
        sync: false
      - key: HISTORY_DAYS
        value: "7"
